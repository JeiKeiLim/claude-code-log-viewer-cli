name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo 'none')
          DATE=$(date -u +%Y-%m-%d)
          go build -ldflags "-s -w \
            -X github.com/JeiKeiLim/claude-code-log-viewer-cli/internal/version.Version=${VERSION} \
            -X github.com/JeiKeiLim/claude-code-log-viewer-cli/internal/version.Commit=${COMMIT} \
            -X github.com/JeiKeiLim/claude-code-log-viewer-cli/internal/version.BuildDate=${DATE}" \
            -o cclv ./cmd/cclv

      - name: Verify build
        run: ./cclv --version
